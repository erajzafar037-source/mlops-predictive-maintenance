[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"

[project]
name="predictive-maintenance-mlops"
version="0.1.0"
description="Leakage-safe predictive maintenance model pipeline and inference API"
requires-python=">=3.11"

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]

[tool.ruff]
line-length=100
target-version="py311"
src=["src"]

[tool.ruff.lint]
select=["F"]
ignore=[]
